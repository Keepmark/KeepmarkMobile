<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Keepmark</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <!-- Asset cache-buster: bump ?v= on every release that touches CSS/JS,
         otherwise the WebView may keep serving stale files after update. -->
    <link rel="stylesheet" href="app.css?v=115" />
    <link rel="stylesheet" href="KeepmarkMobile.styles.css?v=99" />
    <link rel="icon" href="favicon.png?v=80">
</head>

<body>

    <!-- Shared paint servers for the folder tile (RowTile.razor). Defined once
         here so every tile references the same ids; 0x0, not display:none,
         which can drop gradients in WebView. -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
        <defs>
            <linearGradient id="km-fold-face" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b57a8" /><stop offset="1" stop-color="#273f85" /></linearGradient>
            <filter id="km-fold-lift" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="0" dy="-1.2" stdDeviation="1" flood-color="#000" flood-opacity="0.4" /></filter>
        </defs>
    </svg>

    <div class="status-bar-safe-area"></div>

    <div id="app" role="status">Loading...</div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script>
        // Theme: System (default) follows the OS; Light/Dark are forced.
        // Blazor calls xbsSetTheme with the stored Settings value on startup.
        (function () {
            var mq = null;
            try { mq = window.matchMedia('(prefers-color-scheme: dark)'); } catch (e) { }
            function resolve(mode) {
                if (mode === 'Light') return 'light';
                if (mode === 'Dark') return 'dark';
                return (mq && mq.matches) ? 'dark' : 'light';
            }
            window.xbsSetTheme = function (mode) {
                try {
                    window.__xbsThemeMode = mode || 'System';
                    document.documentElement.setAttribute('data-bs-theme', resolve(window.__xbsThemeMode));
                } catch (e) { }
            };
            if (mq && mq.addEventListener) mq.addEventListener('change', function () {
                if ((window.__xbsThemeMode || 'System') === 'System') window.xbsSetTheme('System');
            });
            window.xbsSetTheme('System');
        })();
        // Language: Blazor calls xbsSetLang with the active language and the few
        // strings that live in JS (gestures.js); English stays the fallback.
        window.xbsSetLang = function (lang, strings) {
            try {
                document.documentElement.lang = lang || 'en';
                window.__xbsStrings = strings || {};
                if (window.__xbsRelabel) window.__xbsRelabel();
            } catch (e) { }
        };
    </script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script src="js/gestures.js?v=99"></script>

</body>

</html>
