<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>XBrowserSyncNg</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <!-- Asset cache-buster: bump ?v= on every release that touches CSS/JS,
         otherwise the WebView may keep serving stale files after update. -->
    <link rel="stylesheet" href="app.css?v=50" />
    <link rel="stylesheet" href="XBrowserSyncNg.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script>
        // Follow the system theme for Bootstrap + our custom classes.
        (function () {
            try {
                var mq = window.matchMedia('(prefers-color-scheme: dark)');
                function apply() { document.documentElement.setAttribute('data-bs-theme', mq.matches ? 'dark' : 'light'); }
                apply();
                if (mq.addEventListener) mq.addEventListener('change', apply);
            } catch (e) { /* light default */ }
        })();
    </script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script src="js/gestures.js?v=50"></script>

</body>

</html>
