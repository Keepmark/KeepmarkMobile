<!-- xBrowserSyncNg app icon: isometric bookmark-cube with depth, shine and glow. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10485C"/>
      <stop offset="0.55" stop-color="#0A323D"/>
      <stop offset="1" stop-color="#071E25"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A5EEFB"/>
      <stop offset="1" stop-color="#71D2E2"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3CB894"/>
      <stop offset="1" stop-color="#2E9E7B"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F94A8"/>
      <stop offset="1" stop-color="#1F6B7D"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="108" height="108" rx="24" fill="url(#bg)"/>
  <polygon points="0,0 108,0 40,108 0,108" fill="#FFFFFF" opacity="0.05"/>
  <g filter="url(#soft)">
    <polygon points="54,20 84,38 54,56 24,38" fill="url(#top)"/>
    <polygon points="54,20 84,38 80,41 54,26 28,41 24,38" fill="#EAFBFF" opacity="0.85"/>
    <polygon points="24,38 54,56 54,76 24,58" fill="url(#left)"/>
    <polygon points="54,56 84,38 84,58 54,76" fill="url(#right)"/>
    <polygon points="47,71 61,71 61,92 54,87 47,92" fill="url(#top)"/>
  </g>
</svg>
